<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pradera</title>
<style>
:root{box-sizing:border-box}*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#cfe3ee;overflow:hidden}
.stage{position:relative;width:100%;height:100%;overflow:hidden;
 background:linear-gradient(#8fbfe0 0%,#b9d9ec 32%,#e3eee9 62%,#f4efd9 80%)}
.abs{position:absolute}
.sun{right:9%;top:9%;width:7vmin;height:7vmin;border-radius:50%;
 background:radial-gradient(circle,#fffef0 0 40%,#fff1b8 75%);
 box-shadow:0 0 6vmin 3vmin rgba(255,244,190,.65),0 0 22vmin 10vmin rgba(255,240,190,.28)}
.rays{inset:-20% -10% 30% 30%;pointer-events:none;mix-blend-mode:soft-light;opacity:.55;
 background:repeating-linear-gradient(115deg,transparent 0 6%,rgba(255,250,215,.55) 9%,transparent 13%);
 -webkit-mask-image:radial-gradient(ellipse at 75% 18%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 75% 18%,#000,transparent 70%);
 animation:rays 14s ease-in-out infinite alternate}
@keyframes rays{from{opacity:.3;transform:translateX(-1.5%)}to{opacity:.6;transform:translateX(1.5%)}}
.cloud{position:absolute;left:0;top:var(--t);width:var(--w);height:calc(var(--w)*.14);border-radius:50%;
 background:radial-gradient(ellipse,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);filter:blur(.6vmin);opacity:var(--o);
 animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(130vw)}}
.belt{position:absolute;left:0;width:200%;display:flex;animation:scroll var(--sp) linear infinite;will-change:transform}
.tile{position:relative;width:50%;height:100%}
.tile>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
@keyframes scroll{to{transform:translateX(-50%)}}
.it{position:absolute;transform-origin:50% 100%;animation:sway var(--s,5s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.it svg{display:block;width:100%;height:auto;filter:url(#rough)}
.tree{--a:.7deg}.gr{--a:2.2deg}
@keyframes sway{from{transform:rotate(calc(var(--a,1deg)*-1))}to{transform:rotate(var(--a,1deg))}}
.it.vl{animation:none}
.sm{animation:smoke 5s ease-out infinite;opacity:0}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.6}100%{opacity:0;transform:translate(7px,-22px) scale(2.4)}}
.bl{animation:spin 24s linear infinite;transform-origin:30px 28px}
@keyframes spin{to{transform:rotate(360deg)}}
.mist{position:absolute;left:0;width:200%;height:14%;pointer-events:none;
 background:linear-gradient(transparent,rgba(240,248,244,.5) 50%,transparent);animation:scroll var(--sp) linear infinite}
.bird{position:absolute;left:0;top:var(--t);width:2.2vmin;opacity:.55;animation:fly var(--d) linear infinite;animation-delay:var(--dl)}
.bird svg{width:100%;animation:flap 1.6s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(-10vw,0)}50%{transform:translate(55vw,-3vh)}to{transform:translate(115vw,1vh)}}
@keyframes flap{to{transform:scaleY(.45)}}
.sp{position:absolute;bottom:-2vh;width:var(--z);height:var(--z);border-radius:50%;background:#fff9d6;opacity:0;
 box-shadow:0 0 .8vmin rgba(255,246,190,.8);animation:rise var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes rise{0%{opacity:0}20%{opacity:.7}100%{opacity:0;transform:translate(var(--x),-55vh)}}
.vig{inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(8,40,28,.28))}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="abs sun"></div><div class="abs rays"></div></div>
<script>
const stage=document.getElementById('stage'),NS='http://www.w3.org/2000/svg';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
[[9,'30vmin','.7','150s','-20s'],[20,'22vmin','.5','190s','-120s'],[5,'38vmin','.45','220s','-60s'],[15,'26vmin','.6','170s','-150s']]
.forEach(([t,w,o,d,dl])=>{const c=document.createElement('div');c.className='cloud';
 c.style.cssText=`--t:${t}%;--w:${w};--o:${o};--d:${d};--dl:${dl}`;stage.appendChild(c)});
const W=1440,H=300;
const layers=[
 {b:46,h:34,sp:260,c:['#b7c9dc','#a9bfd2'],base:140,wave:[[55,1,.3],[34,2,1.3],[18,4,.6]],peak:1},
 {b:38,h:30,sp:170,c:['#9fc0bb','#86ada4'],base:130,wave:[[30,2,.4],[12,5,2]],trees:[7,2.4,3.6,['#6f9c8c','#7ba596'],1],seed:3,mist:1},
 {b:28,h:32,sp:100,c:['#7fb08e','#5f9a78'],base:120,wave:[[28,2,2.2],[11,4,.6]],trees:[7,4,6,['#4f8a6a','#5c9674','#3f7a5c'],1],seed:7,mist:1},
 {b:14,h:36,sp:56,c:['#5f9f6c','#3e8456'],base:110,wave:[[26,1,1],[12,3,3.5]],trees:[4,7,10,['#2f6f4b','#3c8058','#285f42'],1],seed:11,fl:[8,2.2],gr:10},
 {b:0,h:30,sp:28,c:['#4f8f4f','#245f38'],base:92,wave:[[13,2,.5],[6,5,2.4]],fl:[26,2.6],gr:40,seed:19}
];
const defs=document.createElementNS(NS,'svg');defs.setAttribute('width',0);defs.setAttribute('height',0);defs.style.position='absolute';
defs.innerHTML=layers.map((L,i)=>`<linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L.c[0]}"/><stop offset="1" stop-color="${L.c[1]}"/></linearGradient>`).join('')+'<filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/><feGaussianBlur stdDeviation=".3"/></filter>';
document.body.appendChild(defs);
function blob(c,R,cx,cy,n,rm,rv){let s='';for(let i=0;i<n;i++){const a=R()*6.283,d=R()*rm;s+=`<circle cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d*.8).toFixed(1)}" r="${(rv*(.6+R()*.5)).toFixed(1)}" fill="${c}"/>`}return s}
function tree(c,R){const k=R();
 if(k<.35)return `<svg viewBox="0 0 40 90"><path d="M19 90C19 80 20 74 20 68L22 68C22 76 22 82 23 90Z" fill="#5a4636"/><path d="M20 3C34 34 33 66 21 80C8 68 6 36 20 3Z" fill="${c}"/><path d="M20 3C34 34 33 66 21 80C26 54 25 30 20 3Z" fill="#000" opacity=".13"/><path d="M15 30C13 44 14 56 17 64" stroke="#fff" stroke-width="3" opacity=".12" fill="none" stroke-linecap="round"/></svg>`;
 if(k<.65){let t='';[[4,28,12],[22,30,16],[42,32,20]].forEach(([y,h,w])=>{t+=`<path d="M25 ${y}Q${25+w*.8} ${y+h*.5} ${25+w} ${y+h}Q25 ${y+h*.82} ${25-w} ${y+h}Q${25-w*.8} ${y+h*.5} 25 ${y}Z" fill="${c}"/><path d="M25 ${y}Q${25+w*.8} ${y+h*.5} ${25+w} ${y+h}Q25 ${y+h*.82} 25 ${y+h*.8}Z" fill="#000" opacity=".12"/>`});
  return `<svg viewBox="0 0 50 90"><path d="M23 90L24 66L27 66L28 90Z" fill="#5a4636"/>${t}</svg>`}
 return `<svg viewBox="0 0 70 90"><path d="M32 90C34 76 33 66 30 56L40 56C37 68 37 78 39 90Z" fill="#5a4636"/><path d="M35 62C28 52 24 48 20 44M36 62C42 54 46 50 50 45" stroke="#5a4636" stroke-width="2.2" fill="none" stroke-linecap="round"/><g opacity=".18">${blob('#000',R,38,40,7,15,13)}</g>${blob(c,R,35,34,10,16,14)}<g opacity=".17">${blob('#fff',R,28,24,4,8,7)}</g></svg>`}
const walls=['#efe6d2','#f3ead7','#e6dac2'],roofs=['#b5694f','#a65a45','#8c6a5a'];
function house(R){const w=walls[Math.floor(R()*3)],r=roofs[Math.floor(R()*3)],d=(R()*3).toFixed(1);
 return `<svg viewBox="0 0 60 50"><path d="M41 11L47 9L48 22L42 22Z" fill="#8b7d6e"/><circle class="sm" cx="45" cy="7" r="2.6" fill="#fff" style="animation-delay:-${d}s"/><circle class="sm" cx="45" cy="7" r="2.6" fill="#fff" style="animation-delay:-${(d-2.5).toFixed(1)}s"/>
 <path d="M7 24Q6 36 7 48L53 48Q54 36 53 24Z" fill="${w}"/><path d="M30 24L53 24Q54 36 53 48L30 48Z" fill="#000" opacity=".07"/>
 <path d="M1 26Q14 14 30 5Q46 14 59 26Q30 21 1 26Z" fill="${r}"/><path d="M30 5Q46 14 59 26Q44 23 30 23Z" fill="#000" opacity=".13"/>
 <rect x="11" y="30" width="8" height="8" rx="2" fill="#f4d98c"/><rect x="36" y="30" width="8" height="8" rx="2" fill="#f4d98c"/><path d="M24 48V39Q28 33 32 39V48Z" fill="#6b4a3a"/>
 <g fill="#4f8a5a">${blob('#4f8a5a',R,12,46,4,5,3.4)}${blob('#5c9a64',R,50,46,4,5,3.4)}</g></svg>`}
function church(){return `<svg viewBox="0 0 50 80"><path d="M4 48Q3 62 4 78L34 78Q35 62 34 48Z" fill="#efe6d2"/><path d="M0 50Q10 39 19 32Q28 39 38 50Z" fill="#8c6a5a"/>
 <path d="M30 26Q29 50 30 78L46 78Q47 50 46 26Z" fill="#f3ead7"/><path d="M38 26L46 26Q47 50 46 78L38 78Z" fill="#000" opacity=".07"/>
 <path d="M28 26Q37 18 38 0Q39 18 48 26Z" fill="#6f7f8c"/><circle cx="38" cy="35" r="4" fill="#fff" stroke="#8b7d6e" stroke-width="1"/>
 <path d="M35 58V52a3 3 0 0 1 6 0V58Z" fill="#8aa0ae"/><path d="M12 78V67Q17 58 22 67V78Z" fill="#6b4a3a"/><rect x="8" y="53" width="4" height="7" rx="2" fill="#f4d98c"/><rect x="26" y="53" width="4" height="7" rx="2" fill="#f4d98c"/></svg>`}
function barn(){return `<svg viewBox="0 0 60 50"><path d="M3 48Q2 34 4 24Q16 14 30 6Q44 14 56 24Q58 34 57 48Z" fill="#9a5b4c"/><path d="M30 6Q44 14 56 24Q58 34 57 48L30 48Z" fill="#000" opacity=".1"/>
 <path d="M3 25Q16 15 30 5Q44 15 57 25" fill="none" stroke="#efe6d2" stroke-width="2" stroke-linecap="round"/><rect x="20" y="28" width="20" height="20" rx="2" fill="#7d4637"/><path d="M21 29L39 47M39 29L21 47" stroke="#efe6d2" stroke-width="1.3" stroke-linecap="round"/></svg>`}
function mill(){return `<svg viewBox="0 0 60 80"><path d="M20 78Q24 54 26 30L34 30Q36 54 40 78Z" fill="#efe6d2"/><path d="M34 30Q36 54 40 78L30 78L30 30Z" fill="#000" opacity=".08"/><path d="M22 31Q30 14 38 31Z" fill="#8c6a5a"/><path d="M27 78V66a3 3 0 0 1 6 0V78Z" fill="#6b4a3a"/>
 <g class="bl" stroke="#8b7d6e" stroke-width="1.6" stroke-linecap="round"><line x1="30" y1="28" x2="30" y2="2"/><line x1="30" y1="28" x2="30" y2="54"/><line x1="30" y1="28" x2="4" y2="28"/><line x1="30" y1="28" x2="56" y2="28"/>
 <g stroke="none" fill="#f4efe2" opacity=".92"><rect x="31" y="4" width="7" height="12" rx="1.5"/><rect x="22" y="40" width="7" height="12" rx="1.5"/><rect x="6" y="21" width="12" height="7" rx="1.5"/><rect x="42" y="29" width="12" height="7" rx="1.5"/></g></g><circle cx="30" cy="28" r="2.4" fill="#6b4a3a"/></svg>`}
const fc=[['#ffffff','#f2c94c'],['#f7e58a','#fff'],['#d7c6f0','#f5e6a0'],['#ffe3ea','#f2c94c']];
function flower(p){return `<svg viewBox="0 0 24 50"><path d="M12 48C12 36 12 26 12 14" stroke="#3b7d4a" stroke-width="1.6" fill="none"/><g fill="${p[0]}">${[0,72,144,216,288].map(a=>`<circle cx="12" cy="8" r="3.6" transform="rotate(${a} 12 12)"/>`).join('')}</g><circle cx="12" cy="12" r="2.6" fill="${p[1]}"/></svg>`}
function grass(c){return `<svg viewBox="0 0 30 40"><g stroke="${c}" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M15 40C14 28 9 18 3 8"/><path d="M15 40C14 26 13 14 12 2"/><path d="M15 40C16 26 17 14 19 3"/><path d="M15 40C17 28 22 18 28 10"/><path d="M15 40C12 32 8 28 5 24"/></g></svg>`}
const fy=(L,x)=>{let y=L.base;const q=2*Math.PI*x/W;for(const[a,k,p]of L.wave)y+=a*Math.sin(q*k+p);
 const m=L.peak?1.8:1;return y+m*(3.2*Math.sin(q*7+1.1)+2.2*Math.sin(q*11+2.3)+1.4*Math.sin(q*17+.4))};
const path=L=>{let d=`M0 ${H} L0 ${fy(L,0)}`;for(let x=10;x<=W;x+=10)d+=` L${x} ${fy(L,x)}`;return d+` L${W} ${H}Z`};
layers.forEach((L,i)=>{const R=rng(L.seed||1);let items='';
 const put=(x,h,w,cls,dy,ex='')=>{const b=(H-fy(L,x))/H*100+dy;
  items+=`<div class="it ${cls}" style="left:${x/W*100}%;bottom:${b}%;width:${w}vmin;--s:${(4+R()*4).toFixed(1)}s;--dl:-${(R()*6).toFixed(1)}s">${h}</div>`};
 if(L.trees){const[n,a,b,cols]=L.trees;for(let k=0;k<n;k++){const x=(k+.15+R()*.7)/n*W;put(x,tree(cols[Math.floor(R()*cols.length)],R),a+R()*(b-a),'tree',-2)}}
 if(L.vil)for(const[x,k,w]of L.vil)put(x,k=='c'?church():k=='b'?barn():k=='m'?mill():house(R),w,'vl',-1.5);
 if(L.fl)for(let k=0;k<L.fl[0];k++)put(R()*W,flower(fc[Math.floor(R()*4)]),L.fl[1]*(.8+R()*.5),'gr',-3);
 if(L.gr)for(let k=0;k<L.gr;k++)put(R()*W,grass(i>3?'#7fc07a':'#4f9a5c'),2.4+R()*3,'gr',-2.5);
 const tile=`<div class="tile"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${path(L)}" fill="url(#g${i})"/></svg>${items}</div>`;
 const belt=document.createElement('div');belt.className='belt';belt.style.cssText=`bottom:${L.b}%;height:${L.h}%;--sp:${L.sp}s`;
 belt.innerHTML=tile+tile;stage.appendChild(belt);
 if(L.mist){const m=document.createElement('div');m.className='mist';m.style.cssText=`bottom:${L.b+L.h*.18}%;--sp:${L.sp*1.4}s`;stage.appendChild(m)}});
[[12,'60s','-5s'],[18,'80s','-40s'],[9,'100s','-70s']].forEach(([t,d,dl])=>{const b=document.createElement('div');b.className='bird';
 b.style.cssText=`--t:${t}%;--d:${d};--dl:${dl}`;b.innerHTML='<svg viewBox="0 0 30 12"><path d="M1 8Q8 0 15 8Q22 0 29 8" stroke="#36505c" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';stage.appendChild(b)});
const R2=rng(5);for(let i=0;i<10;i++){const s=document.createElement('div');s.className='sp';
 s.style.cssText=`left:${R2()*100}%;--z:${(.35+R2()*.4).toFixed(2)}vmin;--x:${(R2()*10-5).toFixed(1)}vw;--d:${(12+R2()*10).toFixed(1)}s;--dl:-${(R2()*18).toFixed(1)}s`;stage.appendChild(s)}
const v=document.createElement('div');v.className='abs vig';stage.appendChild(v);
const gn=document.createElement('div');gn.className='abs';gn.style.cssText='inset:0;pointer-events:none;opacity:.08;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27><filter id=%27n%27><feTurbulence type=%27fractalNoise%27 baseFrequency=%27.8%27 numOctaves=%272%27/></filter><rect width=%27200%27 height=%27200%27 filter=%27url(%23n)%27/></svg>")';stage.appendChild(gn);
</script>
</body>
</html>
