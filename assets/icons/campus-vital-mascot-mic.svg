<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" id="campus-vital-mascot-mic-svg" class="tdea-mascot-svg" role="img" aria-label="Mascota Campus Vital Territorio TdeA - Robot locutor de podcast con micrófono profesional">
  <defs>
    <!-- Filtros de sombra y resplandor -->
    <filter id="mic-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#022B14" flood-opacity="0.45" />
    </filter>
    <filter id="mic-eyes-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00E676" flood-opacity="0.9" />
    </filter>
    <filter id="mic-studio-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00E676" flood-opacity="0.65" />
    </filter>
    <filter id="mic-wave-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#69F0AE" flood-opacity="0.8" />
    </filter>

    <!-- Gradientes institucionales TdeA -->
    <linearGradient id="mic-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C6533" />
      <stop offset="55%" stop-color="#074E26" />
      <stop offset="100%" stop-color="#022A14" />
    </linearGradient>

    <linearGradient id="mic-robot-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F3F6F9" />
      <stop offset="100%" stop-color="#D9E2EC" />
    </linearGradient>

    <linearGradient id="mic-visor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4A27" />
      <stop offset="60%" stop-color="#09381E" />
      <stop offset="100%" stop-color="#031F10" />
    </linearGradient>

    <linearGradient id="mic-mortarboard-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A32" />
      <stop offset="100%" stop-color="#08371C" />
    </linearGradient>

    <!-- Gradientes Metálicos para el Micrófono de Estudio -->
    <linearGradient id="mic-grille-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="mic-body-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E24" />
      <stop offset="35%" stop-color="#00843D" />
      <stop offset="70%" stop-color="#04381A" />
      <stop offset="100%" stop-color="#021C0D" />
    </linearGradient>

    <linearGradient id="mic-stand-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="mic-neon-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69F0AE" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <!-- Patrón de Malla de Estudio -->
    <pattern id="mic-mesh-pattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#475569" stroke-width="0.8" opacity="0.65" />
      <circle cx="3" cy="3" r="1" fill="#1E293B" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .campus-vital-mascot-mic-svg {
      overflow: visible;
      transform-origin: 250px 250px;
    }
    .vital-anim-respiracion {
      transform-origin: 250px 320px;
      animation: vitalBreathe 3.8s infinite ease-in-out;
    }
    @keyframes vitalBreathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.008); }
    }
    .vital-anim-ojos {
      transform-origin: 250px 245px;
      animation: vitalBlink 4.2s infinite ease-in-out;
    }
    @keyframes vitalBlink {
      0%, 91%, 100% { transform: scaleY(1); }
      95.5% { transform: scaleY(0.08); }
    }
    .vital-anim-borla {
      transform-origin: 250px 96px;
      animation: vitalTassel 3.8s infinite ease-in-out;
    }
    @keyframes vitalTassel {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3.2deg); }
    }
    .vital-soundwave-1 {
      animation: micWavePulse 2.4s infinite ease-out;
    }
    .vital-soundwave-2 {
      animation: micWavePulse 2.4s infinite ease-out 0.6s;
    }
    .vital-soundwave-3 {
      animation: micWavePulse 2.4s infinite ease-out 1.2s;
    }
    @keyframes micWavePulse {
      0% { opacity: 0.1; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.04); }
      100% { opacity: 0.1; transform: scale(0.96); }
    }
  </style>

  <!-- CAPA BASE: Fondo circular institucional con aura esmeralda -->
  <!-- Transparente -->
  
  

  <!-- Grupo Principal Animado -->
  <g class="vital-anim-respiracion">

    <!-- TORSO / BASE POSTERIOR DEL ROBOT -->
    <path d="M 160 340 Q 250 310 340 340 L 370 440 Q 250 480 130 440 Z" 
          fill="url(#mic-robot-white)" 
          filter="url(#mic-drop-shadow)" />

    <!-- CABEZA DEL ROBOT (Casco, visor y ojos) -->
    <g id="vital-cabeza">
      <!-- Casco blanco redondeado -->
      <ellipse cx="250" cy="235" rx="140" ry="120" fill="url(#mic-robot-white)" filter="url(#mic-drop-shadow)" />
      <!-- Brillo superior -->
      <path d="M 168 162 Q 250 136 332 162 Q 250 148 168 162 Z" fill="#FFFFFF" opacity="0.85" />

      <!-- Auricular izquierdo tipo DJ/Estudio con luz esmeralda -->
      <g transform="rotate(-3 115 240)">
        <rect x="96" y="200" width="36" height="80" rx="18" fill="url(#mic-stand-metal)" />
        <rect x="100" y="206" width="28" height="68" rx="14" fill="#0C4524" stroke="#00E676" stroke-width="2" />
        <circle cx="114" cy="240" r="7" fill="#00E676" opacity="0.8" filter="url(#mic-eyes-glow)" />
      </g>

      <!-- Auricular derecho tipo DJ/Estudio con luz esmeralda -->
      <g transform="rotate(3 385 240)">
        <rect x="368" y="200" width="36" height="80" rx="18" fill="url(#mic-stand-metal)" />
        <rect x="372" y="206" width="28" height="68" rx="14" fill="#0C4524" stroke="#00E676" stroke-width="2" />
        <circle cx="386" cy="240" r="7" fill="#00E676" opacity="0.8" filter="url(#mic-eyes-glow)" />
      </g>

      <!-- Diadema superior de auriculares de estudio -->
      <path d="M 124 212 C 124 135, 376 135, 376 212" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
      <path d="M 140 200 C 140 145, 360 145, 360 200" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" />

      <!-- Visor Facial Oscuro (Reflejo tecnológico) -->
      <ellipse cx="250" cy="245" rx="116" ry="80" fill="url(#mic-visor-grad)" />
      <ellipse cx="250" cy="245" rx="114" ry="78" fill="none" stroke="#162E22" stroke-width="2.5" />
      <path d="M 162 195 Q 250 168 328 178 Q 250 174 162 195 Z" fill="#FFFFFF" opacity="0.15" />

      <!-- Ojos Amigables (Arco sonriente en verde neón resplandeciente) -->
      <g class="vital-anim-ojos" filter="url(#mic-eyes-glow)">
        <path d="M 182 240 C 182 214, 222 214, 222 240" fill="none" stroke="#00E676" stroke-width="14" stroke-linecap="round" />
        <path d="M 278 240 C 278 214, 318 214, 318 240" fill="none" stroke="#00E676" stroke-width="14" stroke-linecap="round" />
      </g>

      <!-- Sonrisa sutil del robot -->
      <path d="M 234 266 Q 250 276 266 266" fill="none" stroke="#69F0AE" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- BIRRETE INSTITUCIONAL TdeA -->
    <g id="vital-birrete" filter="url(#mic-drop-shadow)">
      <path d="M 158 144 Q 250 170 342 144 L 328 112 Q 250 132 172 112 Z" fill="#09381E" />
      <!-- Logo TdeA en birrete -->
      <g transform="translate(212, 120) scale(0.46)">
        <circle cx="28" cy="28" r="23" fill="#FFFFFF" />
        <path d="M 18 28 Q 28 14 38 28 Q 28 22 18 28 Z" fill="#09381E" />
        <circle cx="28" cy="18" r="5.2" fill="#09381E" />
        <text x="56" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="0.8">TdeA</text>
      </g>
      <!-- Placa diamante birrete -->
      <polygon points="250,44 420,118 250,152 80,118" fill="#00E676" />
      <polygon points="250,36 416,112 250,144 84,112" fill="url(#mic-mortarboard-grad)" />
      <polygon points="250,36 250,144 84,112" fill="#042011" opacity="0.3" />
      <circle cx="250" cy="90" r="9" fill="#FACC15" stroke="#CA8A04" stroke-width="2" />
      <!-- Borla Dorada -->
      <g class="vital-anim-borla">
        <path d="M 250 90 Q 322 87 362 128" fill="none" stroke="#FACC15" stroke-width="5" stroke-linecap="round" />
        <circle cx="362" cy="133" r="7" fill="#FACC15" stroke="#B45309" stroke-width="1.8" />
        <path d="M 354 141 L 370 141 L 378 180 L 346 180 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="1.2" />
      </g>
    </g>

    <!-- ONDAS DE SONIDO / TRANSMISIÓN DE PODCAST (Resplandor esmeralda a los costados del micrófono) -->
    <g id="vital-soundwaves" filter="url(#mic-wave-glow)" transform="origin: 250px 345px">
      <!-- Ondas Izquierda -->
      <path class="vital-soundwave-1" d="M 186 325 C 172 340, 172 360, 186 375" fill="none" stroke="#00E676" stroke-width="3.5" stroke-linecap="round" />
      <path class="vital-soundwave-2" d="M 166 312 C 146 335, 146 365, 166 388" fill="none" stroke="#69F0AE" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <path class="vital-soundwave-3" d="M 146 300 C 120 330, 120 370, 146 400" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

      <!-- Ondas Derecha -->
      <path class="vital-soundwave-1" d="M 314 325 C 328 340, 328 360, 314 375" fill="none" stroke="#00E676" stroke-width="3.5" stroke-linecap="round" />
      <path class="vital-soundwave-2" d="M 334 312 C 354 335, 354 365, 334 388" fill="none" stroke="#69F0AE" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <path class="vital-soundwave-3" d="M 354 300 C 380 330, 380 370, 354 400" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- ========================================================================= -->
    <!-- MICRÓFONO PROFESIONAL DE ESTUDIO / PODCAST (En lugar del corazón)           -->
    <!-- ========================================================================= -->
    <g id="vital-microfono" filter="url(#mic-drop-shadow)">
      
      <!-- Base de Escritorio Ponderada de Estudio -->
      <ellipse cx="250" cy="465" rx="55" ry="14" fill="#0F172A" />
      <ellipse cx="250" cy="463" rx="52" ry="12" fill="url(#mic-stand-metal)" />
      <ellipse cx="250" cy="461" rx="46" ry="10" fill="#1E293B" />
      <ellipse cx="250" cy="459" rx="20" ry="5" fill="#00E676" opacity="0.75" />

      <!-- Mástil / Varilla de soporte vertical -->
      <rect x="244" y="388" width="12" height="74" rx="6" fill="url(#mic-stand-metal)" />
      <rect x="247" y="390" width="6" height="70" fill="#F8FAFC" opacity="0.3" />

      <!-- Montura Antivibración / Shock Mount en U -->
      <path d="M 212 336 C 210 398, 290 398, 288 336" fill="none" stroke="url(#mic-stand-metal)" stroke-width="7" stroke-linecap="round" />
      <!-- Bandas elásticas de sujeción -->
      <line x1="216" y1="360" x2="232" y2="352" stroke="#00E676" stroke-width="2.5" />
      <line x1="216" y1="372" x2="232" y2="380" stroke="#00E676" stroke-width="2.5" />
      <line x1="284" y1="360" x2="268" y2="352" stroke="#00E676" stroke-width="2.5" />
      <line x1="284" y1="372" x2="268" y2="380" stroke="#00E676" stroke-width="2.5" />

      <!-- CUERPO CILÍNDRICO DEL MICRÓFONO (Verde Institucional y Titanio) -->
      <rect x="228" y="342" width="44" height="62" rx="10" fill="url(#mic-body-metal)" stroke="#021C0D" stroke-width="2" />
      <!-- Brillo longitudinal en el cuerpo -->
      <rect x="234" y="346" width="6" height="54" rx="3" fill="#FFFFFF" opacity="0.25" />

      <!-- Anillo LED Indicador 'ON AIR' / Al Aire (Verde Neón) -->
      <g filter="url(#mic-studio-glow)">
        <rect x="225" y="336" width="50" height="9" rx="4.5" fill="url(#mic-neon-ring)" stroke="#00E676" stroke-width="1" />
      </g>

      <!-- REJILLA / CÁPSULA METÁLICA DE CONDENSADOR (Estilo Shure / Neumann) -->
      <path d="M 228 334 
               L 228 290 
               C 228 266, 272 266, 272 290 
               L 272 334 Z" 
            fill="url(#mic-grille-metal)" 
            stroke="#1E293B" 
            stroke-width="2" />
      <!-- Textura de Malla de Estudio -->
      <path d="M 228 334 
               L 228 290 
               C 228 266, 272 266, 272 290 
               L 272 334 Z" 
            fill="url(#mic-mesh-pattern)" 
            opacity="0.85" />
      <!-- Franja metálica central de la rejilla -->
      <line x1="250" y1="270" x2="250" y2="334" stroke="#F1F5F9" stroke-width="2.5" opacity="0.6" />
      <rect x="227" y="306" width="46" height="5" rx="2" fill="#334155" />

      <!-- Emblema TdeA sutil en el cuerpo del micrófono -->
      <circle cx="250" cy="372" r="7" fill="#0C4524" stroke="#00E676" stroke-width="1.2" />
      <text x="250" y="375" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="7" fill="#A7F3D0" text-anchor="middle">T</text>
    </g>

    <!-- BRAZOS ROBÓTICOS DEL LOCUTOR (Posando amigablemente junto al micrófono) -->
    <!-- Brazo Izquierdo -->
    <g id="vital-brazo-izquierdo" filter="url(#mic-drop-shadow)">
      <path d="M 148 340 
               C 120 370, 130 420, 178 428 
               C 200 432, 218 422, 226 405 
               C 216 396, 202 390, 186 386 
               C 162 378, 156 358, 160 340 Z" 
            fill="url(#mic-robot-white)" 
            stroke="#D9E2EC" 
            stroke-width="1.5" />
      <!-- Patita / Mano izquierda ajustando cerca del micrófono -->
      <g transform="translate(196, 394) rotate(-14)">
        <rect x="0" y="0" width="28" height="15" rx="7.5" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" />
        <circle cx="7" cy="7.5" r="4.5" fill="#F3F6F9" />
        <circle cx="16" cy="7.5" r="4.5" fill="#F3F6F9" />
        <circle cx="23" cy="7.5" r="3.5" fill="#F3F6F9" />
      </g>
    </g>

    <!-- Brazo Derecho (Saludando al oyente del podcast) -->
    <g id="vital-brazo-derecho" filter="url(#mic-drop-shadow)">
      <path d="M 350 338 
               C 380 365, 372 415, 324 426 
               C 302 430, 282 420, 274 405 
               C 284 396, 298 390, 314 386 
               C 338 378, 344 358, 340 338 Z" 
            fill="url(#mic-robot-white)" 
            stroke="#D9E2EC" 
            stroke-width="1.5" />
      <!-- Patita / Mano derecha cerca del pedestal del micrófono -->
      <g transform="translate(276, 386) rotate(14)">
        <rect x="0" y="0" width="28" height="15" rx="7.5" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" />
        <circle cx="7" cy="7.5" r="4.5" fill="#F3F6F9" />
        <circle cx="16" cy="7.5" r="4.5" fill="#F3F6F9" />
        <circle cx="23" cy="7.5" r="3.5" fill="#F3F6F9" />
      </g>
    </g>

  </g>
</svg>