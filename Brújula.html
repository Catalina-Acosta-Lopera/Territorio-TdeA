<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brújula</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: transparent !important;
  background-color: transparent !important;
}
body {
  display: grid;
  place-items: center;
  background: transparent !important;
  background-color: transparent !important;
}
.wrap {
  position: relative;
  width: min(85vmin, 260px);
  max-width: 270px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
  margin: auto;
}
.wrap svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  animation: bob 4.2s ease-in-out infinite alternate;
  transform-origin: 50% 60%;
}
.shadow {
  position: absolute;
  left: 18%;
  right: 18%;
  bottom: -3%;
  height: 5%;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.28);
  filter: blur(8px);
  animation: sh 4.2s ease-in-out infinite alternate;
}
@keyframes bob {
  from { transform: translateY(0) rotate(-0.8deg); }
  to { transform: translateY(-2.2%) rotate(0.8deg); }
}
@keyframes sh {
  from { transform: scale(1); opacity: 0.9; }
  to { transform: scale(0.86); opacity: 0.6; }
}
.glint {
  animation: glint 6s ease-in-out infinite;
}
@keyframes glint {
  0%, 55% { transform: translateX(-120px); }
  85%, 100% { transform: translateX(150px); }
}
.pop {
  animation: pop 0.5s ease-out;
}
@keyframes pop {
  40% { transform: scale(1.05); }
}
@media (prefers-reduced-motion: reduce) {
  .wrap svg, .shadow, .glint { animation: none; }
}
</style>
</head>
<body>
<div class="wrap" id="wrap" role="button" tabindex="0" aria-label="Brújula">
<svg viewBox="0 0 200 232" id="svg" aria-hidden="true">
 <defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd978"/><stop offset=".5" stop-color="#e9ac35"/><stop offset="1" stop-color="#b87714"/></linearGradient>
  <linearGradient id="gold2" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f4c658"/><stop offset="1" stop-color="#c88519"/></linearGradient>
  <radialGradient id="face" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#f6ead0"/><stop offset="1" stop-color="#e3cf9f"/></radialGradient>
  <clipPath id="fc"><circle cx="100" cy="132" r="64"/></clipPath>
 </defs>
 <!-- ring -->
 <circle cx="100" cy="24" r="17" fill="none" stroke="url(#gold)" stroke-width="9"/>
 <circle cx="100" cy="24" r="17" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2" stroke-dasharray="20 90" stroke-linecap="round" transform="rotate(-150 100 24)"/>
 <rect x="86" y="38" width="28" height="18" rx="6" fill="url(#gold2)"/>
 <!-- case -->
 <circle cx="100" cy="134" r="84" fill="#8a5a12" opacity=".35"/>
 <circle cx="100" cy="132" r="82" fill="url(#gold)"/>
 <circle cx="100" cy="132" r="73" fill="url(#gold2)"/>
 <circle cx="100" cy="132" r="70" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.4"/>
 <circle cx="100" cy="132" r="66" fill="url(#face)"/>
 <circle cx="100" cy="132" r="66" fill="none" stroke="#9c6d1c" stroke-opacity=".5" stroke-width="2"/>
 <g id="ticks" clip-path="url(#fc)"></g>
 <!-- needle -->
 <g id="needle" style="transform-origin:100px 132px">
  <path d="M100 66L110 132H90Z" fill="#c9302c"/><path d="M100 66L110 132H100Z" fill="#9f1f1f" opacity=".55"/><path d="M100 66L93 112L96 100Z" fill="#fff" opacity=".35"/>
  <path d="M100 198L110 132H90Z" fill="#3d78b8"/><path d="M100 198L110 132H100Z" fill="#244f85" opacity=".6"/>
 </g>
 <circle cx="100" cy="132" r="8" fill="url(#gold)" stroke="#8a5a12" stroke-width="1.2"/><circle cx="100" cy="132" r="3.4" fill="#fff3c4"/>
 <!-- glass -->
 <g clip-path="url(#fc)"><path d="M52 98Q70 70 112 68Q80 82 66 118Z" fill="#fff" opacity=".4"/>
  <g class="glint"><rect x="86" y="50" width="12" height="170" fill="#fff" opacity=".22" transform="rotate(24 100 132)"/></g></g>
</svg>
<div class="shadow"></div>
</div>
<script>
const needle = document.getElementById('needle');
const wrap = document.getElementById('wrap');
const ticks = document.getElementById('ticks');

document.documentElement.style.background = 'transparent';
document.body.style.background = 'transparent';

let t = '';
for (let i = 0; i < 72; i++) {
  const a = i * 5;
  const isCardinal = (a % 90 === 0);
  const isMajor = (a % 15 === 0);
  const length = isCardinal ? 6.5 : (isMajor ? 5 : 3.2);
  t += `<line x1="100" y1="68" x2="100" y2="${68 + length}" stroke="#7a5a2a" stroke-opacity="${isCardinal ? 0.8 : (isMajor ? 0.65 : 0.35)}" stroke-width="${isCardinal ? 1.6 : (isMajor ? 1.3 : 1)}" stroke-linecap="round" transform="rotate(${a} 100 132)"/>`;
}
ticks.innerHTML = t;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let a = -80, v = 0, base = 0, mousePull = 0, last = performance.now(), time = 0;
const K = 70, C = 5.2;

function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  time += dt;

  const wob = reduce ? 0 : (2.2 * Math.sin(time * 1.3) + 1.1 * Math.sin(time * 2.9 + 1) + 0.5 * Math.sin(time * 5.3));
  const target = base + wob + mousePull;

  v += (-K * (a - target) - C * v) * dt;
  a += v * dt;

  needle.style.transform = `rotate(${a}deg)`;
  requestAnimationFrame(frame);
}

if (reduce) { a = 0; }
requestAnimationFrame(frame);

function calibrate() {
  base += 360;
  wrap.classList.remove('pop');
  void wrap.offsetWidth;
  wrap.classList.add('pop');
}

wrap.addEventListener('click', calibrate);
wrap.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    calibrate();
  }
});

window.addEventListener('mousemove', (e) => {
  if (reduce) return;
  const rect = wrap.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height * 0.57;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);

  if (dist < 380) {
    const angle = Math.atan2(dy, dx) * (180 / Math.PI) - 90;
    const diff = Math.sin((angle - a) * Math.PI / 180);
    mousePull = diff * 12 * Math.max(0, 1 - dist / 380);
  } else {
    mousePull = 0;
  }
});

window.addEventListener('mouseleave', () => {
  mousePull = 0;
});

window.addEventListener('message', (event) => {
  if (!event.data) return;
  if (event.data === 'calibrate' || event.data.type === 'calibrate') {
    calibrate();
  } else if (event.data === 'pulse' || event.data.type === 'pulse') {
    v += (Math.random() > 0.5 ? 40 : -40);
  }
});
</script>
</body>
</html>
